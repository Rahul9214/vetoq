[project]
name = "vetoq-api"
version = "0.1.0"
description = "VETOQ foundation API; health endpoints only."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
